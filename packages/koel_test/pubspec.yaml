name: koel_test
description: Test fixtures, MockAgent, and ConformanceRunner for koel adapters.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  # First runtime cross-package edge in the workspace. koel_core types
  # (AbstractAgent, AgUiEvent, RunAgentInput) appear in MockAgent's public
  # signature, so this is a regular dependency, not a dev_dependency. Bare key —
  # resolved from the pub workspace. Ranged ^1.0.0 — hybrid versioning (FR-H2).
  koel_core: ^1.0.0
  # ConformanceReport/ConformanceFailure are freezed (structural ==/hashCode for
  # AR-16's AgUiEvent_equal). Runtime annotation only — freezed-ONLY, no
  # json_serializable: the report needs value equality, not a JSON codec.
  freezed_annotation: ^3.1.0

dev_dependencies:
  koel_lints: ^1.0.0
  test: ^1.25.0
  # Exact koel_core pins (D2 / SCP-2026-05-29-B): freezed 3.2.6-dev.1 is the
  # analyzer-12 stopgap — a stable freezed would break the workspace analyzer
  # pin. Only generated artifact is *.freezed.dart (no *.g.dart, no build.yaml).
  build_runner: ^2.4.0
  freezed: 3.2.6-dev.1
