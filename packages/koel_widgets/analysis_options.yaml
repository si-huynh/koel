# koel_widgets analyzer config — curated Flutter lint profile (AI-6.1, Epic-6 retro).
#
# koel_widgets is a Flutter package (Material/Cupertino widget primitives, Epic 7),
# so it opts into the curated Flutter rule set on top of the workspace baseline.
# Story 1.7's design keeps `plugins:` ONLY at the workspace root (the analyzer
# rejects it in any inner file, `plugins_in_inner_options`); this file declares
# NO `plugins:` — it composes the root (recommended + the koel_lints plugin) with
# the shared Flutter profile via a list-include. The `flutter_lints` PACKAGE is
# NOT a dependency (AR-1) — the rules are SDK-bundled, enabled by name.
#
# The package-contract doc gate (`public_member_api_docs`) lands HERE at
# koel_widgets' finalize story (Story 7.4), mirroring how koel_core (2.15) /
# koel_flutter (6.8) gated their own public surface. It declares NO `plugins:`
# (root-only — the analyzer rejects `plugins:` in any inner file,
# `plugins_in_inner_options`), so it is not a 1.7 reversal; it is scoped to
# koel_widgets so the package gates its own public surface at seal time.
include:
  - ../../analysis_options.yaml
  - package:koel_lints/koel_flutter.yaml

analyzer:
  # Generated code is not part of the documented public contract; excluding it
  # keeps `public_member_api_docs` from firing on freezed/json_serializable output.
  # Inert for koel_widgets (no generated lib files — no freezed/g.dart) but kept
  # verbatim for sibling-parity with koel_core/koel_flutter.
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    # The machine enforcer of NFR-16: every public-named member in lib/ (incl.
    # lib/src/) carries a doc — the seal-time gate for the 8-symbol contract.
    public_member_api_docs: true
    # Keeps `[Type]` references in dartdoc resolvable so `dart doc` stays at
    # exit 0 with no broken-reference warnings.
    comment_references: true
