# conformance.yml — AG-UI conformance suite (FR-G4) via koel_test's
# ConformanceRunner driven against each backend adapter. Story 1.5 shipped a
# green-by-default placeholder; Story 5.3 wires the real lane (koel_agno).
#
# Offline by design: the conformance tests replay captured/synthesized fixtures
# through a MockClient, so NO backend container runs in CI — live capture is a
# one-time operator step (`make up-agno` → tool/capture_fixtures.dart). Stories
# 5.6 (langgraph), 5.9 (dojo), and 5.11 (copilotkit v2 — replacing the removed 5.9
# GraphQL copilotkit lane with native-SSE replay) extend the lane by adding their
# own `@Tags(['conformance'])` tests; `melos run conformance` picks them up.
name: Conformance
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `melos bootstrap` runs `flutter pub get` (the workspace contains Flutter
      # packages), so this lane needs flutter on PATH; flutter-action provides
      # both flutter and a compatible dart (3.12.0). (setup-dart alone failed
      # bootstrap with "flutter: not found".)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      # Generated code (*.freezed.dart) is gitignored — ConformanceReport is
      # freezed, so build before the conformance run (same as ci.yml).
      - run: melos run build
      - run: melos run conformance
