name: koel_http
description: HTTP/SSE transport for AG-UI agents — HttpAgent, SseParser, interceptors.
version: 1.1.0
repository: https://github.com/si-huynh/koel
homepage: https://github.com/si-huynh/koel#readme

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  # First runtime cross-package edge for koel_http (mirrors koel_test's pattern).
  # The SSE parser's implementation references koel_core types — AgUiEvent /
  # AgUiEvent.fromWire (dispatch target), ProtocolError + KoelErrorCode
  # (wire-sanity boundary). Ranged ^1.0.0 — hybrid versioning (FR-H2).
  koel_core: ^1.0.0
  # koel_http's FIRST codegen (Story 4.6): the `TraceEntry` value type written
  # to an `EventTraceInterceptor`'s `Sink` is freezed per AC2 — matching every
  # other koel value type (RunAgentInput, the event/error unions). freezed
  # *without* json: TraceEntry is an in-process Dart record, never serialized to
  # the wire, so no json_serializable. Pin mirrors koel_core (SCP-2026-05-29-B).
  freezed_annotation: ^3.1.0
  # The native byte-streaming transport (Story 4.2): the default `http.Client()`
  # is an `IOClient` wrapping `dart:io HttpClient`, whose `send().stream` is the
  # live, unbuffered `Stream<List<int>>` `SseParser` consumes. `http.Client` is
  # also the injectable seam the `HttpAgent` constructor exposes for tests
  # (`MockClient`) and Epic-5 backends.
  http: ^1.6.0
  # Cancellation fallback (Story 4.3): when a client ignores abort, koel drops
  # the connection silently and emits one `Level.WARNING` (runtime-once) — the
  # SDK's sole logging facade per architecture §4 (no `print`). First use in the
  # monorepo.
  logging: ^1.3.0
  # `@visibleForTesting` on the test-only reset of the abort-not-honored
  # process-once gate (Story 4.3): production never resets it, so the annotation
  # makes the analyzer reject any non-test caller — the once-per-process contract
  # is enforced, not just documented.
  meta: ^1.16.0
  # The web byte-streaming transport (Story 4.10). `package:web` is the WASM-ready
  # JS-interop binding for `window.fetch` + `ReadableStream` + `AbortController` —
  # the only way to stream SSE on web: `package:http`'s `BrowserClient` uses XHR
  # and buffers the whole body (fatal for an infinite stream), and `EventSource`
  # can't set the `Authorization` header `AuthInterceptor` needs (D4). Loaded only
  # on web via the `transport.dart` conditional import (`dart.library.js_interop`),
  # so the VM never sees it. Was transitive (via `http`/`test`); now direct. The
  # JS↔Dart bridges (`dart:js_interop`) are SDK — no pubspec entry. No `dart:html`
  # (legacy, not WASM-compatible).
  web: ^1.1.0
  # koel_http's FIRST third-party runtime dep (Story 4.7). The pure-Dart Sentry
  # SDK (NOT sentry_flutter — koel_http is framework-free) backs the default-OFF
  # `SentryBreadcrumbInterceptor`: it adds AG-UI run breadcrumbs to the ambient
  # Sentry hub so a consumer's captured errors carry run context. "default-OFF"
  # is structural — the interceptor is never in HttpAgent's default chain and
  # emits nothing unless the consumer registers it AND has called `Sentry.init`.
  # Pure Dart (VM + web), no Flutter/native, no `analyzer` edge — leaves the
  # SCP-2026-05-29-B analyzer-12 pin untouched.
  sentry: ^9.21.0

dev_dependencies:
  koel_lints: ^1.0.0
  # The codegen toolchain for `TraceEntry` (Story 4.6) — koel_http's first. Pins
  # mirror koel_core exactly (SCP-2026-05-29-B): freezed `3.2.6-dev.1` is the
  # documented analyzer-12 stopgap so freezed and koel_lints' analysis_server_
  # plugin coexist in one workspace resolution. The workspace `melos run build`
  # codegen-drift gate now covers this package.
  build_runner: ^2.4.0
  freezed: 3.2.6-dev.1
  test: ^1.25.0
  # The web transport's browser integration test (Story 4.10) runs under
  # `@TestOn('browser')`, where `dart:io` is unavailable — so its mock SSE server
  # lives in a `spawnHybridUri` VM isolate whose `hybridMain(StreamChannel, …)`
  # entrypoint types its channel with `package:stream_channel`. `package:test`
  # pulls it transitively, but the hybrid server file imports it directly, so it
  # is a first-class dev dep (per the `spawnHybridUri` doc's explicit note).
  stream_channel: ^2.1.0
  # Reused in the agent suite: FixtureLoader replays the Epic 3 synthesized wire
  # fixtures through a local SSE server for the happy-path assertion (AC3).
  koel_test: ^1.0.0
