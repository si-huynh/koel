# ci.yml — primary per-PR gate: analyze + format-check + test.
# Epic 1 skeleton was a single Linux job. Story 4.10 grows it to a Linux + macOS
# native matrix plus a headless-Chrome `web` job, so koel_http's dual transport
# (native dart:io ⟂ web fetch/ReadableStream) both run on every PR (NFR-11).
# Story 6.7 adds `flutter-smoke` — the monorepo's FIRST `flutter test` lanes —
# running koel_flutter's render smoke on macOS/Linux/Windows (host flutter_tester)
# and web (dart2js + headless Chrome), the NFR-11 dart:io-divergence proof. The
# full 10 pkgs × 6 platforms expansion — including iOS/Android device lanes — is
# still Epic 9 (AR-17).
# Story 9.2 adds `example-app` (lint/format/smoke of the repo-root example/) and
# `example-build` — the SIX-PLATFORM `flutter build` matrix proving the meta-package
# quickstart app compiles + bundles on iOS/Android/web/macOS/Windows/Linux (AC2).
name: CI
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  analyze-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `melos bootstrap` runs `flutter pub get` (the workspace contains Flutter
      # packages), so even this Dart-centric lane needs flutter on PATH;
      # flutter-action provides both flutter and a compatible dart (3.12.0).
      # (setup-dart alone failed bootstrap with "flutter: not found".)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      # Generated code (*.freezed.dart / *.g.dart) is gitignored, so it must be
      # produced before analyze/test or `dart analyze` errors on the missing
      # `part` files and `_$Type` references. (Story 2.1, retro D2.)
      - run: melos run build
      - run: melos run analyze
      - run: melos run format:check
      # Hybrid-versioning convention (Story 9.1, FR-H2 / R-2..R-3): lock-step
      # foundations + ranged intra-repo deps + koel_lints dev-only. Always-on
      # per-PR gate ⇒ green main is a publish precondition (R-5).
      - run: melos run verify:versioning
      - run: melos run test

  # koel_http's web transport (Story 4.10) is `@TestOn('browser')` and is
  # platform-skipped by the VM `melos run test` above; this job runs it against
  # headless Chrome (preinstalled on ubuntu-latest), exercising the real
  # fetch + ReadableStream + AbortController path.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `melos bootstrap` runs `flutter pub get` (the workspace contains Flutter
      # packages), so even this Dart-centric lane needs flutter on PATH;
      # flutter-action provides both flutter and a compatible dart (3.12.0).
      # (setup-dart alone failed bootstrap with "flutter: not found".)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      - run: melos run build
      - run: dart test -p chrome
        working-directory: packages/koel_http

  # flutter-smoke (Story 6.7, NFR-11) — the first `flutter test` lanes in the
  # monorepo. koel_flutter is a library package with no platform folders, so it
  # runs a pure-render smoke (test/smoke/six_platform_smoke_test.dart) as a plain
  # flutter_test widget test — NO integration_test, NO device infra:
  #   * macOS / Linux / Windows → host flutter_tester (compile + render on each OS)
  #   * web                     → `--platform chrome` (dart2js + headless Chrome),
  #                               the NFR-11 dart:io-free proof (web has no dart:io)
  # The smoke uses a local web-safe AbstractAgent, NOT koel_test's MockAgent —
  # mock_agent.dart transitively imports dart:io (fixture_loader), which alone
  # fails the dart2js web compile. iOS/Android device/build verification needs an
  # example app or emulator/simulator and rides the Epic 9 / AR-17 full 10×6 device
  # matrix: a no-channel render smoke shares the same Dart frontend as the desktop
  # lanes, so mobile adds ~no marginal coverage here (storage channel coverage is
  # already in 6.3/6.4's own tests). subosito/flutter-action bundles a compatible
  # Dart, so no separate setup-dart. flutter-version pinned to .tool-versions.
  flutter-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-latest, test: flutter test test/smoke }
          - { platform: macos, os: macos-latest, test: flutter test test/smoke }
          - { platform: windows, os: windows-latest, test: flutter test test/smoke }
          - { platform: web, os: ubuntu-latest, test: flutter test --platform chrome test/smoke }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      # Generated *.freezed.dart (koel_core, a transitive dep) is gitignored, so
      # build it before `flutter test` — same reason analyze-test builds first.
      - run: melos run build
      - run: ${{ matrix.test }}
        working-directory: packages/koel_flutter

  # goldens (Story 7.4) — the deterministic golden gate. Flutter goldens are
  # platform-specific (rounded-corner anti-aliasing differs per OS), so the
  # committed PNGs (packages/koel_widgets/test/goldens/) are Linux-rendered and
  # this Linux-only lane is the SOLE place the `golden`-tagged tests run (the
  # cross-platform `melos run test` excludes them via --exclude-tags=perf,golden).
  # To regenerate after an intentional visual change: re-run with --update-goldens
  # here (or in a Flutter 3.44.0 Linux container) and commit the new bytes.
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      - run: melos run build
      - run: flutter test --tags golden
        working-directory: packages/koel_widgets

  # example-smoke (Story 7.4, architecture §6) — the koel_widgets example app
  # builds and runs its fixture turn to completion without throwing. The example
  # is a pub-workspace member but NOT a melos package, so it is exercised only
  # here, not by `melos run test`.
  example-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      - run: melos run build
      # The example is not a melos package, so `melos run analyze` skips it —
      # enforce its own curated lint profile here so a lint/doc regression in the
      # consumer-facing reference cannot ship undetected.
      - run: dart analyze
        working-directory: packages/koel_widgets/example
      - run: flutter test
        working-directory: packages/koel_widgets/example

  # example-app lint/format/smoke (Story 9.2, FR-H3 / AR-22) — the repo-root
  # `example/` quickstart app consuming the `koel` meta-package. `tool/format.sh`
  # formats `packages/` only, so the root example's Dart is format-checked HERE
  # (plus analyze + smoke), mirroring the koel_widgets example-smoke lane.
  example-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      - run: melos run build
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: example
      - run: dart analyze
        working-directory: example
      - run: flutter test
        working-directory: example

  # example-build (Story 9.2, AC2 / NFR-11 / AR-22) — proves the repo-root
  # example COMPILES + BUNDLES on all six targets, each on the runner OS that
  # supports it. These are `flutter build` assertions (compile + bundle), not
  # device runs: iOS uses --no-codesign (no CI signing cert), Android builds the
  # debug apk (no release keystore). Device/simulator *run* lanes remain the
  # Epic 9 / AR-17 full matrix (continuing 6.7's deferral). The six platform
  # folders are committed by `flutter create`, so the builds (and a human
  # `flutter run`) work from a clean checkout.
  example-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      # Codegen for the transitive koel_core *.freezed.dart before any build.
      - run: melos run build
      # The Linux desktop toolchain is not preinstalled on ubuntu runners.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - if: matrix.os == 'ubuntu-latest'
        working-directory: example
        run: |
          flutter build web --release
          flutter build linux --release
          flutter build apk --debug
      - if: matrix.os == 'macos-latest'
        working-directory: example
        run: |
          flutter build macos --release
          flutter build ios --release --no-codesign
      - if: matrix.os == 'windows-latest'
        working-directory: example
        run: flutter build windows --release
