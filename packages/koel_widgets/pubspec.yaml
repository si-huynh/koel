name: koel_widgets
description: Material 3 + Cupertino chat UI primitives (theme, bubble, input, follow-up list).
version: 1.0.0
publish_to: none
repository: https://github.com/si-huynh/koel
homepage: https://github.com/si-huynh/koel#readme

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  # `KoelTheme` is pure framework data — `ThemeExtension`, `Color`, `TextStyle`,
  # `EdgeInsets` all come from `package:flutter` (material library). Bare
  # `sdk: flutter` key — pub workspace resolves it.
  flutter:
    sdk: flutter
  # koel_core: `MessageBubble` (7.2) renders a `Message`/`MessageRole`. These are
  # NOT re-exported by koel_flutter (its barrel deliberately re-exports nothing
  # from koel_core), so the direct dep is mandatory — `depend_on_referenced_packages`
  # fires otherwise. Ranged ^1.0.0 — hybrid versioning (FR-H2).
  koel_core: ^1.0.0
  # koel_flutter: `MessageBubble` parses content via `MessageContentParser` and
  # renders the sealed `MessageSegment`/`TextSegment`/`CodeBlockSegment` (Story 6.5).
  # koel_widgets' first UI-layer cross-package dep. (counter-metric CM-3 — exactly
  # these two intra-repo deps, no koel_test: widget tests build `Message` literals.)
  koel_flutter: ^1.0.0

dev_dependencies:
  koel_lints: ^1.0.0
  flutter_test:
    sdk: flutter
