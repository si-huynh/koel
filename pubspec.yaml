name: koel_workspace
description: Dart pub workspace root for the koel monorepo. Not published.
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - packages/koel
  - packages/koel_core
  - packages/koel_http
  - packages/koel_lints
  - packages/koel_agno
  - packages/koel_langgraph
  - packages/koel_runtime
  - packages/koel_flutter
  - packages/koel_widgets
  - packages/koel_widgets/example
  - packages/koel_devtools
  - packages/koel_test
  - example

dev_dependencies:
  melos: ^7.8.0

melos:
  scripts:
    analyze:
      description: Run `dart analyze .` per package (NFR-13 gate).
      exec: dart analyze .
    test:
      description: Run `dart test` per package (CWD = package root for fixture reads, deferred-work.md :158), excluding the perf benches. Scaffold packages with no test files yet (exit 79) are tolerated; real failures propagate. See tool/test_package.sh.
      exec: bash "$MELOS_ROOT_PATH/tool/test_package.sh"
    test:coverage:
      description: Per-package line + branch coverage gates (NFR-12) — koel_core & koel_http ≥90% (kernel tier), koel_flutter ≥90% (foundation tier, VM via flutter_tester, no with_chrome), koel_test, koel_agno, koel_langgraph, koel_runtime & koel_widgets ≥80% (tooling/adapter/UI tier). koel_http merges a headless-Chrome pass (with_chrome) so its web transport is covered for real. koel_flutter & koel_widgets run `flutter test --coverage` (native lcov.info, branch defaults 100 → line is the gate; koel_widgets excludes the Linux-canonical golden tests by tag). Generated files excluded via each package's coverage_options.yaml (none for koel_flutter/koel_widgets — no generated lib files); perf/golden tests excluded by tag. See tool/coverage.sh.
      run: |
        set -e
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_core 90 90
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_http 90 90 with_chrome
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_test 80 80
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_agno 80 80
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_langgraph 80 80
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_runtime 80 80
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_flutter 90 90
        bash "$MELOS_ROOT_PATH/tool/coverage.sh" packages/koel_widgets 80 80
    build:
      description: Run `build_runner build` in packages that declare build_runner (codegen-drift gate).
      exec: dart run build_runner build
      packageFilters:
        dependsOn: build_runner
    format:
      description: Format hand-written Dart under packages/ (generated files excluded — see tool/format.sh).
      run: bash tool/format.sh write
    format:check:
      description: Check hand-written Dart formatting (read-only CI gate; generated excluded — retro D2; see tool/format.sh).
      run: bash tool/format.sh check
    analyze:apply:
      description: Run `dart fix --apply` per package (auto-apply analyzer fixes).
      exec: dart fix --apply
    capture-fixtures:
      description: "Fixture-capture pipeline (4 backends → JSONL); agno live (5.3), langgraph 5.6, dojo+copilotkit 5.9. Pass --backend=<name> [--base-url=<url>] [--token=<t>]."
      run: dart run "$MELOS_ROOT_PATH/tool/capture_fixtures.dart"
    conformance:
      description: "AG-UI conformance lane (FR-G4) — runs the `conformance`-tagged tests (ConformanceRunner vs each backend adapter, offline MockClient replay) per package; tolerates packages with none yet. koel_agno now (5.3); langgraph 5.6, copilotkit 5.9 extend it. See tool/conformance.sh."
      exec: bash "$MELOS_ROOT_PATH/tool/conformance.sh"
    verify:versioning:
      description: "Hybrid-versioning convention gate (Story 9.1, FR-H2 / R-2..R-3) — the ten v1.0.0 release pubspecs carry lock-step foundation versions, ranged (^X.Y.Z) intra-repo deps, and koel_lints dev-only; koel_devtools + koel_widgets/example excluded. bash+awk, zero new dep. See tool/verify_versioning.sh."
      run: bash "$MELOS_ROOT_PATH/tool/verify_versioning.sh"
    api-diff:
      description: "Public-API breaking-change gate (Story 9.3, NFR-14 / AR-12 / D7) — runs dart_apitool per package, diffing the current public surface against the committed packages/<pkg>/.api-baseline/<pkg>.json. Default verifies (breaking blocks, additive warns); pass `-- --update` to refresh the baselines. Shells out to the GLOBAL dart-apitool 0.23.1 (never a workspace dep). See tool/verify_api_surface.dart."
      run: dart run "$MELOS_ROOT_PATH/tool/verify_api_surface.dart"
