# Analyzer config for the repo-root koel example — the curated Flutter lint
# profile, so the consumer-facing reference is held to the same bar as shipped
# code. Mirrors packages/koel_widgets/example/analysis_options.yaml: it pulls the
# workspace root config (one level up) plus the shared koel_lints Flutter rule
# set. It is NOT a melos package (melos' `packages/*` glob does not match this
# repo-root dir), so it stays out of `melos run analyze`/`test` and is exercised
# only by the CI example-app lane. Declares NO `plugins:` (root-only).
include:
  - ../analysis_options.yaml
  - package:koel_lints/koel_flutter.yaml
