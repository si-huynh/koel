name: koel_flutter
description: Flutter glue for koel — controller, scope, session storage, generative UI.
version: 1.0.0
publish_to: none
repository: https://github.com/si-huynh/koel
homepage: https://github.com/si-huynh/koel#readme

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  # First Flutter (non-pure-Dart) package in the workspace. `flutter` carries
  # `ChangeNotifier` (package:flutter/foundation.dart) — KoelChatController's base.
  flutter:
    sdk: flutter
  # koel_core: ChatSession/ChatState/RunPhase appear in the controller's public
  # signature (A.6), so this is a regular dependency. Ranged ^1.0.0 (FR-H2).
  koel_core: ^1.0.0
  # hive_ce ("Hive Community Edition"): the maintained successor to the abandoned
  # `hive` (2.2.3). HiveSessionStorage stores `jsonEncode(state.toJson())` as a
  # String in a Box<String> — runtime API only (openBox/get/put/delete/keys), so
  # NO hive_ce_generator (no TypeAdapter/typeId) and NO hive_ce_flutter. The
  # consumer adds hive_ce_flutter and calls `Hive.initFlutter()` in their own
  # app bootstrap (D5/D7) — koel never owns Hive's storage-path init.
  hive_ce: ^2.19.3
  # flutter_secure_storage: the encrypted-at-rest sibling of hive_ce. SecureSessionStorage
  # stores `jsonEncode(state.toJson())` as a String value under a koel-namespaced key —
  # runtime API only (write/read/readAll/delete; never deleteAll, D4). `FlutterSecureStorage`
  # appears in SecureSessionStorage's public A.6 constructor, so this is a regular dependency
  # (same reasoning as koel_core/hive_ce). koel performs NO init; the consumer owns platform
  # setup — iOS/macOS Keychain entitlement, Android min-API/backup, Windows VC++, Linux
  # keyring (D5, documented per-platform in README per N-11). Canonical, maintained by
  # steenbakker.dev (160/160 pub points, BSD-3); v10 default constructor is `const` (D2).
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  koel_lints: ^1.0.0
  flutter_test:
    sdk: flutter
  # MockAgent.fromFixture + bundled dojo fixtures drive the widget tests (A.9).
  koel_test: ^1.0.0
  # Test-only — proof that an unmodified ChangeNotifier slots into every
  # state-management framework with zero adapter code (FR-D4 / AC4). These must
  # NEVER move to `dependencies`: the package ships no framework dependency.
  provider: ^6.1.2
  flutter_bloc: ^9.1.0
  flutter_riverpod: ^2.6.1
  get: ^4.7.2
