# Analyzer config for the koel_widgets example — the curated Flutter lint profile.
#
# Mirrors the package's own config (the workspace root + the shared koel_lints
# Flutter rule set) so the demo is held to the same bar as shipped code. It is
# NOT a melos package (melos' `packages/*` glob does not match this nested dir),
# so it stays out of `melos test`/`analyze`/`test:coverage` and is exercised only
# by the CI `example-smoke` lane. Declares NO `plugins:` (root-only).
include:
  - ../../../analysis_options.yaml
  - package:koel_lints/koel_flutter.yaml
