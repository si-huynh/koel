name: koel_core
description: AG-UI protocol kernel for Dart — events, errors, pipeline, reducer, JSON Patch.
version: 1.1.1
repository: https://github.com/si-huynh/koel
homepage: https://github.com/si-huynh/koel#readme

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  # freezed 3.2.6-dev.1 is a documented stopgap (D2 / SCP-2026-05-29-B): no stable
  # freezed supports analyzer 13, so the whole workspace is held at analyzer 12.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  koel_lints: ^1.0.0
  build_runner: ^2.4.0
  freezed: 3.2.6-dev.1
  json_serializable: ^6.8.0
  test: ^1.25.0
