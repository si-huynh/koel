# conformance.yml — AG-UI conformance suite (FR-G4) via koel_test's
# ConformanceRunner driven against each backend adapter. Story 1.5 shipped a
# green-by-default placeholder; Stories 5.3 (agno), 5.6 (langgraph), and 5.11
# (copilotkit v2 — native AG-UI over SSE) wired the real lane. As of Epic 9 the
# lane is COMPLETE: all three backend adapters — AgnoAgent (koel_agno),
# LangGraphAgent (koel_langgraph), and the v2 native-SSE CopilotRuntimeAgent
# (koel_runtime) — ship a `@Tags(['conformance'])` test driving ConformanceRunner
# over the synthesized all_event_types corpus + their real captured fixtures, and
# a genuine conformance failure exits non-zero (tool/conformance.sh's 0/79/65
# tolerance covers only packages with NO conformance test, never a real failure).
# Story 9.5 verifies this lane (no behavior change); the removed 5.9 dojo /
# copilotkit-GraphQL lane (SCP-2026-06-05) is superseded by the 5.11 v2 lane.
#
# Offline by design: the conformance tests replay captured/synthesized fixtures
# through a MockClient, so NO backend container runs in CI — live capture is a
# one-time operator step (`make up-agno` → tool/capture_fixtures.dart).
# `melos run conformance` picks up every `@Tags(['conformance'])` test.
name: Conformance
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `melos bootstrap` runs `flutter pub get` (the workspace contains Flutter
      # packages), so this lane needs flutter on PATH; flutter-action provides
      # both flutter and a compatible dart (3.12.0). (setup-dart alone failed
      # bootstrap with "flutter: not found".)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      # Generated code (*.freezed.dart) is gitignored — ConformanceReport is
      # freezed, so build before the conformance run (same as ci.yml).
      - run: melos run build
      - run: melos run conformance
