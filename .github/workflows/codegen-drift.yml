# codegen-drift.yml — fails the PR if committed sources drift from build_runner output.
# Meaningful from Epic 2 onward (first freezed/json_serializable codegen lands in koel_core, Story 2.1).
name: Codegen drift
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `melos bootstrap` runs `flutter pub get` (the workspace contains Flutter
      # packages), so this lane needs flutter on PATH; flutter-action provides
      # both flutter and a compatible dart (3.12.0). (setup-dart alone failed
      # bootstrap with "flutter: not found".)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: dart pub global activate melos 7.8.0
      - run: melos bootstrap
      - run: melos run build
      # Generated outputs are COMMITTED since v1.1.1 (.gitignore no longer
      # excludes *.g.dart/*.freezed.dart — ignoring them shipped uncompilable
      # pub.dev archives, since `dart pub publish` honors .gitignore). A dirty
      # tree after the build therefore means a codegen input changed without
      # re-running build_runner: the committed files are stale → fail. The
      # porcelain check also catches NEW generated files that were never added
      # (plain `git diff` is blind to untracked paths).
      - name: Verify committed generated files match build_runner output
        run: |
          set -euo pipefail
          drift=$(git status --porcelain -- '*.g.dart' '*.freezed.dart' '*.mocks.dart')
          if [ -n "$drift" ]; then
            echo "Committed generated files drift from build_runner output — re-run codegen and commit:" >&2
            printf '%s\n' "$drift" >&2
            git diff -- '*.g.dart' '*.freezed.dart' '*.mocks.dart' >&2
            exit 1
          fi
      # Determinism check: stage build #1's output into the index (`git add
      # --force`; harmless now the files are tracked), force a genuine re-generation, then
      # `git diff` working-tree-vs-index. Empty iff codegen is deterministic;
      # non-empty means non-deterministic/unstable codegen → fail. (NOT
      # `git diff --cached`, which compares index-vs-HEAD — that would be vacuous
      # here: the drift step above already guarantees index == HEAD.)
      #
      # build_runner is incremental: without deleting the outputs AND its build
      # cache, build #2 sees unchanged inputs and writes 0 outputs, leaving the
      # working tree byte-identical to the index — the diff could never differ
      # and the determinism check would be vacuous. So wipe both before build #2.
      - name: Verify codegen is deterministic
        run: |
          set -euo pipefail
          gen() { find packages -path '*/lib/*' \( -name '*.g.dart' -o -name '*.freezed.dart' -o -name '*.mocks.dart' \); }
          files=$(gen)
          if [ -z "$files" ]; then echo "No generated files found — expected at least koel_core." >&2; exit 1; fi
          git add --force $files
          # shellcheck disable=SC2086
          rm -f $files
          rm -rf packages/*/.dart_tool/build
          melos run build
          # shellcheck disable=SC2086
          git diff --exit-code -- $files
