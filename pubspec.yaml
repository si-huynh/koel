name: koel_workspace
description: Dart pub workspace root for the koel monorepo. Not published.
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - packages/koel
  - packages/koel_core
  - packages/koel_http
  - packages/koel_lints
  - packages/koel_agno
  - packages/koel_langgraph
  - packages/koel_runtime
  - packages/koel_flutter
  - packages/koel_widgets
  - packages/koel_devtools
  - packages/koel_test

dev_dependencies:
  melos: ^7.8.0

melos:
  scripts:
    analyze:
      description: Run `dart analyze .` per package (NFR-13 gate).
      exec: dart analyze .
    test:
      description: wired in story 2.15
      run: dart --version
    test:coverage:
      description: wired in story 2.15
      run: dart --version
    build:
      description: Run `build_runner build` in packages that declare build_runner (codegen-drift gate).
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner
    format:
      description: Run `dart format .` per package.
      exec: dart format .
    format:check:
      description: Run `dart format` in check mode per package (read-only CI gate).
      exec: dart format --output=none --set-exit-if-changed .
    analyze:apply:
      description: Run `dart fix --apply` per package (auto-apply analyzer fixes).
      exec: dart fix --apply
