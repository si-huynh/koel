# koel_test package-finalization analyzer config (Story 3.5).
#
# The SECOND member `analysis_options.yaml` in the workspace (after koel_core,
# Story 2.15). Same shape: it declares NO `plugins:` — per Story 1.7 `plugins:`
# lives only at the workspace root (the analyzer rejects it in any inner file,
# `plugins_in_inner_options`). This file only `include:`s the root (inheriting
# `recommended.yaml` + the koel_lints plugin) and layers the package-contract
# doc lints on top. Plugin-free → not a 1.7 reversal; scoped to koel_test so the
# epic-sealing doc gate turns on exactly when the package finalizes.
include: ../../analysis_options.yaml

analyzer:
  # Generated code is not part of the documented public contract; excluding it
  # keeps `public_member_api_docs` from firing on freezed output.
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    # The machine enforcer of the doc gate: every exported public symbol carries
    # a doc (backfilled across the 3.1–3.4 surfaces this gate now covers).
    public_member_api_docs: true
    # Keeps `[Type]` references in dartdoc resolvable so `dart doc` stays at
    # exit 0 with no broken-reference warnings.
    comment_references: true
